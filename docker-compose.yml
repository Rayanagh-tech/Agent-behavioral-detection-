# V1 : même topologie que la V0 (réseau 172.28.0.0/24), avec identité authentifiée et télémétrie.
# Les secrets ci-dessous sont des valeurs de démonstration synthétiques (jamais de vrais identifiants).
x-agent: &agent
  build: .
  depends_on:
    server:
      condition: service_healthy
  volumes:
    - ./logs:/app/logs

services:
  server:
    build: .
    command: ["python", "server.py"]
    ports:
      - "8000:8000"
    environment:
      SECRES_SIGNING_KEY: cle-de-signature-de-demonstration
      SECRES_LOG_DIR: /app/logs
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318   # optionnel (voir README)
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      lab:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  bon-agent:
    <<: *agent
    command: ["python", "agent.py", "bon"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: bon-agent
      AGENT_SECRET: demo-secret-bon-agent
      SCENARIO: bon
      SECRES_SPAN_DIR: /app/logs/spans
    networks:
      lab:
        ipv4_address: 172.28.0.4

  non-authorise-agent:
    <<: *agent
    command: ["python", "agent.py", "acces_non_autorise"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: non-authorise-agent
