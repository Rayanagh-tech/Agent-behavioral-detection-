services:
  server:
    build: .
    command: ["python", "server.py"]
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks: 
      lab:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  bon-agent:
    build: .
    command: ["python", "agent.py", "bon"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: bon-agent
      SCENARIO: bon
    depends_on:
      server:
        condition: service_healthy
    networks: 
      lab:
        ipv4_address: 172.28.0.4

  non-authorise-agent:
    build: .
    command: ["python", "agent.py", "acces_non_autorise"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: non-authorise-agent
      SCENARIO: acces_non_autorise
    depends_on:
      server:
        condition: service_healthy
    networks: 
      lab:
        ipv4_address: 172.28.0.5

  exfiltration-agent:
    build: .
    command: ["python", "agent.py", "exfiltration"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: exfiltration-agent
      SCENARIO: exfiltration
    depends_on:
      server:
        condition: service_healthy
    networks: 
      lab:
        ipv4_address: 172.28.0.6

  abus-outils-agent:
    build: .
    command: ["python", "agent.py", "abus_outils"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: abus-outils-agent
      SCENARIO: abus_outils
    depends_on:
      server:
        condition: service_healthy
    networks: 
      lab:
        ipv4_address: 172.28.0.7

  contournement-validation-agent:
    build: .
    command: ["python", "agent.py", "contournement_validation"]
    environment:
      SERVER_URL: http://server:8000
      AGENT_ID: contournement-validation-agent
      SCENARIO: contournement_validation
    depends_on:
      server:
        condition: service_healthy
    networks: 
      lab:
        ipv4_address: 172.28.0.8

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24